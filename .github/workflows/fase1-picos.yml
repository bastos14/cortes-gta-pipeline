# Fases 1+2: analisa o VOD em blocos paralelos (chat + áudio + transcrição) e monta a galeria de aprovação.
# (O nome do arquivo é mantido para não precisar registrar o workflow de novo.)
name: Fase 1+2 - Picos e galeria de aprovação

on:
  workflow_dispatch:
    inputs:
      vod_url:
        description: "URL do VOD (Kick ou Twitch)"
        required: true
        type: string
      streamer:
        description: "id do streamer em streamers.yaml"
        required: true
        default: "allanstag"
        type: string
      inicio_seg:
        description: "Início da análise (segundos)"
        default: "0"
        type: string
      duracao_seg:
        description: "Duração a analisar em segundos (0 = até o fim do VOD)"
        default: "1800"
        type: string
      bloco_min:
        description: "Tamanho de cada bloco paralelo (minutos)"
        default: "30"
        type: string
      top_n:
        description: "Quantos candidatos na galeria"
        default: "10"
        type: string

permissions:
  contents: read

jobs:
  plano:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matriz: ${{ steps.p.outputs.matriz }}
      vod_ts: ${{ steps.p.outputs.vod_ts }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - run: python3 -m pip install --quiet "yt-dlp[default,curl-cffi]" pyyaml
      - name: Info do VOD, GATE de permissão e plano de blocos
        id: p
        env:
          VOD_URL: ${{ inputs.vod_url }}
          STREAMER: ${{ inputs.streamer }}
          INICIO: ${{ inputs.inicio_seg }}
          DURACAO: ${{ inputs.duracao_seg }}
          BLOCO: ${{ inputs.bloco_min }}
        run: |
          yt-dlp --no-playlist --dump-single-json --no-download "$VOD_URL" > info.json
          read TS DUR < <(python3 -I scripts/vod_info.py info.json)
          python3 -I scripts/gate.py --id "$STREAMER" --vod-timestamp "$TS"
          echo "vod_ts=$TS" >> "$GITHUB_OUTPUT"
          echo "matriz=$(python3 scripts/plano.py "$DUR" "$INICIO" "$DURACAO" "$((BLOCO*60))")" >> "$GITHUB_OUTPUT"
          echo "VOD: ${DUR}s, início UTC $TS"

  bloco:
    needs: plano
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.plano.outputs.matriz) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - name: Dependências
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Baixar bloco (360p, serve para análise e prévias)
        env:
          VOD_URL: ${{ inputs.vod_url }}
          INICIO: ${{ matrix.inicio }}
          DURACAO: ${{ matrix.duracao }}
        run: |
          mkdir -p w
          yt-dlp --no-playlist --quiet --progress --download-sections "*${INICIO}-$((INICIO+DURACAO))" \
            -f "best[height<=360]/worst" --merge-output-format mp4 -o "w/video.%(ext)s" "$VOD_URL"
          ls -lh w
      - name: Chat (melhor esforço)
        continue-on-error: true
        env:
          VOD_URL: ${{ inputs.vod_url }}
          VOD_TS: ${{ needs.plano.outputs.vod_ts }}
          INICIO: ${{ matrix.inicio }}
          DURACAO: ${{ matrix.duracao }}
        run: |
          if [[ "$VOD_URL" == *kick.com/* ]]; then
            SLUG=$(echo "$VOD_URL" | sed -E 's#.*kick.com/([^/]+)/.*#\1#')
            python3 scripts/chat_kick.py --slug "$SLUG" --vod-timestamp "$VOD_TS" --inicio "$INICIO" \
              --duracao "$DURACAO" --out w/chat.json | grep -E '^chat(: ok| t_min)' || true
          fi
      - name: Picos e prévias
        env:
          INICIO: ${{ matrix.inicio }}
        run: |
          set -o pipefail
          VIDEO=$(ls w/video.* | head -n1)
          CHAT=""; [ -f w/chat.json ] && CHAT="--chat w/chat.json"
          python3 scripts/picos.py --video "$VIDEO" --offset "$INICIO" $CHAT --saida w/picos.json | head -1
          python3 scripts/previas.py --video "$VIDEO" --picos w/picos.json --offset "$INICIO" --saida w/previas
      - uses: actions/upload-artifact@v4
        with:
          name: bloco-${{ matrix.i }}
          path: |
            w/picos.json
            w/previas
          retention-days: 3

  galeria:
    needs: [plano, bloco]
    if: ${{ !cancelled() && needs.plano.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bloco-*
          path: blocos
      - name: Montar galeria
        env:
          TOP: ${{ inputs.top_n }}
          META: '{"streamer":"${{ inputs.streamer }}","vod":"${{ inputs.vod_url }}","run":"${{ github.run_id }}"}'
        run: |
          python3 scripts/galeria.py --blocos blocos --saida galeria --top "$TOP" --meta "$META" | tee resumo.txt
          { echo '## Galeria de aprovação'; echo '```'; cat resumo.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          du -sh galeria
      - uses: actions/upload-artifact@v4
        with:
          name: galeria-${{ github.run_id }}
          path: galeria
          retention-days: 14

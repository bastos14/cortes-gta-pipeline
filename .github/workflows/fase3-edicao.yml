# Fase 3: edição final dos cortes aprovados na galeria (tela dividida, frase, marca d'água, legenda).
# Um job por corte, em paralelo; cada corte sai em seu próprio artefato (corte-<id>-<run_id>).
name: Fase 3 - Edição final

on:
  workflow_dispatch:
    inputs:
      vod_url:
        description: "URL do VOD (a mesma da galeria)"
        required: true
        type: string
      galeria_run:
        description: "run_id da galeria (artefato galeria-<run_id>); ignorado se 'trechos' for preenchido"
        required: false
        default: "0"
        type: string
      trechos:
        description: "Alternativa à galeria: trechos inicio-fim em segundos do VOD, separados por vírgula (ex: 11460-11495,21474-21509)"
        required: false
        default: ""
        type: string
      aprovados:
        description: "ids aprovados separados por vírgula, ou 'todos'"
        default: "todos"
        type: string
      streamer:
        description: "id do streamer em streamers.yaml"
        default: "allanstag"
        type: string
      atrasos:
        description: "Calibração de sincronia: lista de audio_atraso_s (ex: -0.3,-0.15,0,0.15,0.3). Vazio = corte normal"
        default: ""
        type: string
      com_logo:
        description: "Teste: encaixar a logo Modo Gamer BR (true/false). Para publicar só com autorização da organização."
        default: "false"
        type: string
      altura_max:
        description: "Altura máxima do vídeo (1080 = final; 480 = teste rápido)"
        default: "1080"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  plano:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matriz: ${{ steps.m.outputs.matriz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -m pip install --quiet "yt-dlp[default,curl-cffi]" pyyaml
      - name: GATE de permissão
        env:
          VOD_URL: ${{ inputs.vod_url }}
          STREAMER: ${{ inputs.streamer }}
        run: |
          yt-dlp --no-playlist --dump-single-json --no-download "$VOD_URL" > info.json
          read TS DUR < <(python3 -I scripts/vod_info.py info.json)
          python3 -I scripts/gate.py --id "$STREAMER" --vod-timestamp "$TS"
      - uses: actions/download-artifact@v4
        if: ${{ inputs.trechos == '' }}
        with:
          name: galeria-${{ inputs.galeria_run }}
          path: galeria
          run-id: ${{ inputs.galeria_run }}
          github-token: ${{ github.token }}
      - name: Montar matriz (um corte por job)
        id: m
        env:
          APROVADOS: ${{ inputs.aprovados }}
          TRECHOS: ${{ inputs.trechos }}
        run: |
          python3 -I - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          if os.environ["TRECHOS"].strip():
              ids = list(range(1, len(os.environ["TRECHOS"].split(",")) + 1))
          else:
              ids = [p["id"] for p in json.load(open("galeria/picos_final.json", encoding="utf-8"))["top"]]
          a = os.environ["APROVADOS"].strip().lower()
          if a != "todos":
              ok = {int(x) for x in a.split(",") if x.strip()}
              ids = [i for i in ids if i in ok]
          print("matriz=" + json.dumps({"id": ids}))
          PY

  editar:
    needs: plano
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.plano.outputs.matriz) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - name: Dependências
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          mkdir -p ~/.fonts && cp assets/fonts/*.ttf ~/.fonts/ && fc-cache -f
          python3 -m pip install --quiet -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-medium-v1
      - uses: actions/download-artifact@v4
        if: ${{ inputs.trechos == '' }}
        with:
          name: galeria-${{ inputs.galeria_run }}
          path: galeria
          run-id: ${{ inputs.galeria_run }}
          github-token: ${{ github.token }}
      - name: Editar corte ${{ matrix.id }}
        env:
          VOD_URL: ${{ inputs.vod_url }}
          ID: ${{ matrix.id }}
          STREAMER: ${{ inputs.streamer }}
          ALTURA: ${{ inputs.altura_max }}
          ATRASOS: ${{ inputs.atrasos }}
          COM_LOGO: ${{ inputs.com_logo }}
          TRECHOS: ${{ inputs.trechos }}
        run: |
          set -o pipefail
          python3 scripts/editar.py --picos galeria/picos_final.json --aprovados "$ID" \
            --vod "$VOD_URL" --streamer "$STREAMER" --altura-max "$ALTURA" --atrasos="$ATRASOS" --trechos="$TRECHOS" \
            $([ "$COM_LOGO" = "true" ] && echo --com-logo) --saida cortes | tee resumo.txt
          { echo "## Corte $ID"; echo '```'; grep -v '^==' resumo.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: corte-${{ matrix.id }}-${{ github.run_id }}
          path: cortes
          retention-days: 14

# Configuração geral do pipeline (sem segredos).
campanha:
  hashtag_obrigatoria: "#allanstag"    # vai no TÍTULO de todos os cortes
  marca_dagua_texto: "kick.com/allanstag"   # obrigatória, o corte todo, legível
  idioma_textos: pt-BR                 # regra 12: sem títulos/hashtags em outro idioma
corte:
  duracao_min_s: 20
  duracao_max_s: 45
  formato: "9:16"
# REGRA 17: qualquer marca/logo sobreposto precisa de autorização prévia da organização.
# Fica DESLIGADA nos cortes do campeonato até o Gabriel receber o OK do administrador.
marca_dagua_propria:
  arquivo: assets/logo.png             # "Modo Gamer BR", centralizada na divisória
  ativa: false
publicacao:
  max_cortes_por_dia_por_rede: 4       # regras 22/26: evitar volume artificial; ajustável
  intervalo_minimo_entre_posts_min: 90
dedupe:
  mesma_plataforma_trecho_repetido: bloquear   # regra 15
redes_de_saida: [tiktok, shorts]       # Facebook NUNCA (Creator Fast Track)
narracao:
  ativa: false                         # voz sintética: manter OFF no campeonato (regra 14, a confirmar)
picos:
  janela_s: 35            # tamanho da janela candidata (dentro de 20-45 s)
  passo_s: 5
  top_n: 10
  whisper_modelo: small
  pesos_com_chat:  {chat: 0.35, audio: 0.30, texto: 0.35}
  pesos_sem_chat:  {audio: 0.45, texto: 0.55}
  palavras_gatilho:       # reações típicas (peso 1 = normal, 2 = forte)
    2: [caralho, "meu deus", "não acredito", socorro, "que isso", "o que é isso", "não pode ser", "pelo amor", "que absurdo", "morri", "kkkk", "haha", rsrs]
    0.5: [mano, nossa, olha, gente, uau, eita, sério]
    1: ["ai não", "ferrou", "fui preso", "polícia", "perseguição", "tiro", "morreu", "roubo", "assalto", "bateu", "explodiu", "aí sim", "ganhei", "perdi", "mentira"]
  # ---- filtro das REGRAS (Fase 2): janela com estes termos na fala (inclui o áudio do jogo) nunca entra ----
  bloqueio:
    sexual: ["rola\\b", "chupar", "chupa\\b", "transa", "sexo", "sexual", "peito", "bunda", "buceta", "pica\\b", "punheta", "tesao", "estupr"]
    drogas: ["cocain", "maconha", "droga", "crack", "heroin", "cheirar", "baseado", "lsd", "metanfet", "overdose", "traficante", "trafico"]
    apostas: ["aposta", "apostar", "bet\\b", "bet365", "cassino", "tigrinho", "jogo do bicho", "blaze", "roleta", "cupom", "codigo promocional"]
    marcas_links: ["instagram", "tiktok", "youtube", "facebook", "twitter", "whatsapp", "link na bio", "\\.com", "ifood", "uber", "nike"]
    sensivel: ["suicid", "nazi", "hitler", "racis", "viado", "bicha", "macaco", "politic", "bolsonaro", "lula", "trump"]
  palavrao: ["caralh", "porra", "fod", "fud", "put[ao]", "merda", "cacete", "cuzao", "viado", "otario", "arrombad"]
  palavrao_max: 2
  movimento_percentil_min: 30
  movimento_penalidade: 0.6
edicao:                   # Fase 3 (layout 9:16: streamer em cima, jogo embaixo)
  largura: 1080
  altura: 1920
  topo_altura: 608        # px da área da câmera (câmera inteira 16:9 em 1080 px de largura); o resto é o jogo
  censurar_palavroes: true  # legenda queimada esconde palavrão (C******); o áudio original não é alterado
  audio_atraso_s: 0       # ajuste fino de sincronia: + atrasa o áudio, - adianta
  whisper_modelo_legenda: medium
  legenda_palavras_por_bloco: 3
  legenda_cor_destaque: "3CC9FF"   # amarelo pôr do sol #FFC93C (BGR no ASS)
  paleta:                          # kit do perfil @modogamerbr (RGB hex)
    fundo: "0B0714"
    rosa: "FF2E88"
    ciano: "19E3FF"
    amarelo: "FFC93C"
    roxo: "2A0F4D"
  paleta_bgr: {rosa: "882EFF"}     # mesma cor no formato BGR do ASS (sombra do título)
  faixa_altura: 230                # faixa do título na divisória (px)
  logo_largura: 200
  frase_tamanho: 180
  frase_entrelinha: 68
  frase_sombra: 7
  legenda_margem_inferior: 420     # px do rodapé (zona livre da interface do TikTok/Shorts)
  marca_dagua_y: 170               # px do topo; texto kick.com/allanstag, o corte todo
  frase_max_palavras: 6
  fonte: "DejaVu Sans"
  crf: 20
